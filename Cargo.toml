[package]
name = "voxel-engine"
version = "0.8.8"
edition = "2021"
license = "MIT"
description = "A clean-room Rust voxel engine foundation"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = "0.6"

[lib]
path = "src/lib.rs"

[[bin]]
name = "voxel-engine"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
